    - name: Ensuring Homebrew Is Installed
      stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: homebrew_check

    - name: Updating Homebrew
      homebrew:
        update_homebrew: true
      when: homebrew_check.stat.exists

    - name: Upgrading Homebrew Packages
      homebrew:
        upgrade_all: "{{ upgrade_homebrew_packages }}"
      register: result
      until: result is successful
      when: homebrew_check.stat.exists

    - name: Tap a Homebrew repository, state present
      community.general.homebrew_tap:
        name: "{{ homebrew_taps }}"
        state: present

    - name: Installing Homebrew Packages
      homebrew:
        name: "{{ brew_packages }}"
        state: present
      register: result
      until: result is successful
      when: homebrew_check.stat.exists

    - name: Ensure Homebrew shellenv is configured in .bashrc
      ansible.builtin.lineinfile:
        path: "/home/{{ lookup('env', 'USER') }}/.bashrc"
        line: 'eval "$({{ brew_path }} shellenv)"'
        insertafter: EOF

    - name: Ensure Homebrew shellenv is configured in .zshrc
      ansible.builtin.lineinfile:
        path: "/home/{{ lookup('env', 'USER') }}/.zshrc"
        line: 'eval "$({{ brew_path }} shellenv)"'
        insertafter: EOF